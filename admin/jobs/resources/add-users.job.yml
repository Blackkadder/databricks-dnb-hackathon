resources:
  jobs:
    add_hackathon_users:
      name: add-hackathon-account-users
      parameters:
        - name: csv_path
          default: /Volumes/admin/workshop_provisioning/user_provisioning/users.csv
        - name: catalog
          default: databricks-hackathon
        - name: schema_owner_group
          default: rob.bajra@databricks.com
        - name: run_live
          default: "false"
        - name: grant_databricks_sql_access
          default: "true"
        - name: provision_git_folders
          default: "true"
        - name: provision_company_schemas
          default: "true"
      tasks:
        - task_key: add_hackathon_users
          notebook_task:
            notebook_path: ../notebooks/add_users.py
            base_parameters:
              account_host: ${var.account_host}
              secret_scope: ${var.secret_scope}
              account_id_secret_key: ${var.account_id_secret_key}
              admin_sp_username_secret_key: ${var.admin_sp_username_secret_key}
              admin_sp_client_secret_key: ${var.admin_sp_client_secret_key}
              csv_path: "{{job.parameters.csv_path}}"
              run_live: "{{job.parameters.run_live}}"
              grant_databricks_sql_access: "{{job.parameters.grant_databricks_sql_access}}"
              provision_git_folders: "{{job.parameters.provision_git_folders}}"
        - task_key: create_company_schemas
          depends_on:
            - task_key: add_hackathon_users
          notebook_task:
            notebook_path: ../notebooks/create_company_schemas.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema_owner_group: "{{job.parameters.schema_owner_group}}"
              csv_path: "{{job.parameters.csv_path}}"
              run_live: "{{job.parameters.run_live}}"
              provision_company_schemas: "{{job.parameters.provision_company_schemas}}"
