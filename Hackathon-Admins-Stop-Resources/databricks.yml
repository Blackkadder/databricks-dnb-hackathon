# Databricks Asset Bundle configuration, more info here: https://docs.databricks.com/en/dev-tools/bundles/settings.html
bundle:
  name: "hackathon-shutdown-resources"

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  # The 'dev' target, for development purposes. This target is the default.
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-7f5ee9e8-6a84.cloud.databricks.com/

  # The 'prod' target, used for production deployment.
  prod:
    mode: production
    workspace:
      host: https://dbc-7f5ee9e8-6a84.cloud.databricks.com/
      # We always use /Users/bo.cheng@databricks.com for all resources to make sure we only have a single copy.
      root_path: /Users/bo.cheng@databricks.com/.bundle/${bundle.name}/${bundle.target}
    run_as:
      # This runs as bo.cheng@databricks.com in production. We could also use a service principal here,
      # see https://docs.databricks.com/dev-tools/bundles/permissions.html.
      user_name: bo.cheng@databricks.com
